name: swift-format

on:
  pull_request:
    paths:
      - 'gita/**/*.swift'

permissions:
  contents: write

jobs:
  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}

      - name: Format Swift files
        run: xcrun swift format --recursive --in-place gita

      - name: Commit and push changes
        run: |
          git diff --exit-code --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gita
          git commit -m "Auto-format Swift files"
          git push
