[package]
name = "gita_adblock_compile"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "gita_adblock_compile"
path = "src/main.rs"

[dependencies]
adblock = { version = "=0.12.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking", "resource-assembler"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
